<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140B08"/>
      <stop offset="50%" stop-color="#26120C"/>
      <stop offset="100%" stop-color="#3B180E"/>
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <radialGradient id="flameRadial" cx="65%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#140B08" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bbBg)"/>
  <rect width="800" height="500" fill="url(#flameRadial)"/>

  <!-- Geometric Takeaway Box Pattern -->
  <g transform="translate(560, 240) rotate(-12)">
    <rect x="-80" y="-80" width="160" height="160" rx="24" fill="none" stroke="rgba(249, 115, 22, 0.25)" stroke-width="2"/>
    <rect x="-60" y="-60" width="120" height="120" rx="16" fill="rgba(249, 115, 22, 0.08)" stroke="url(#orangeGlow)" stroke-width="2.5"/>
    <path d="M -30 -10 Q 0 -50 30 -10" fill="none" stroke="#F97316" stroke-width="3"/>
    <circle cx="0" cy="15" r="12" fill="#F97316"/>
  </g>

  <!-- Mobile Food Ordering UI Mockup -->
  <g transform="translate(100, 95)">
    <!-- Smartphone Frame -->
    <rect width="340" height="300" rx="20" fill="#171922" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.65))"/>
    
    <!-- Top Notch -->
    <rect x="110" y="8" width="120" height="16" rx="8" fill="#0E1015"/>
    <circle cx="210" cy="16" r="3" fill="#374151"/>

    <!-- App Content -->
    <text x="24" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#F97316" letter-spacing="1.5">BIRIYANI BOX · PERTH</text>
    <text x="24" y="95" font-family="'Syne', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Direct Cloud Kitchen</text>
    <text x="24" y="118" font-family="-apple-system, sans-serif" font-size="11" fill="#9CA3AF">Zero third-party commission takeaway ordering</text>

    <!-- Food Item Card Inside Mockup -->
    <g transform="translate(24, 135)">
      <rect width="292" height="70" rx="12" fill="#202432" stroke="rgba(255,255,255,0.06)"/>
      <rect x="12" y="12" width="46" height="46" rx="8" fill="rgba(249, 115, 22, 0.2)"/>
      <circle cx="35" cy="35" r="14" fill="#F97316"/>
      <text x="70" y="32" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Dum Biriyani Feast Box</text>
      <text x="70" y="48" font-family="-apple-system, sans-serif" font-size="11" fill="#F97316" font-weight="700">$21.50 AUD</text>
      <g transform="translate(225, 22)">
        <rect width="55" height="26" rx="6" fill="#F97316"/>
        <text x="27" y="17" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">+ Add</text>
      </g>
    </g>

    <!-- Bottom Stat Pill -->
    <g transform="translate(24, 225)">
      <rect width="292" height="50" rx="10" fill="rgba(249, 115, 22, 0.08)" stroke="rgba(249, 115, 22, 0.25)"/>
      <text x="16" y="24" font-family="'Syne', sans-serif" font-size="14" font-weight="800" fill="#F97316">3.4x Order Volume</text>
      <text x="16" y="40" font-family="-apple-system, sans-serif" font-size="10" fill="#9CA3AF">vs Traditional Food Aggregator Apps</text>
    </g>
  </g>
</svg>
