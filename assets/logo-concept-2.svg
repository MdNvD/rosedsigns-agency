<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Velvet Rose Gradients -->
    <linearGradient id="roseP1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="100%" stop-color="#C9184A"/>
    </linearGradient>
    <linearGradient id="roseP2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E23B55"/>
      <stop offset="100%" stop-color="#800F2F"/>
    </linearGradient>
    <linearGradient id="roseP3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF758F"/>
      <stop offset="100%" stop-color="#D90429"/>
    </linearGradient>
    <linearGradient id="goldCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Background Squircle Badge -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="#12141C" stroke="rgba(255,255,255,0.09)" stroke-width="1.5"/>

  <!-- Geometric Architectural Rose (Rose + Compass of Design Direction + Blooming Petals) -->
  <g transform="translate(50, 50)">
    <!-- Base Petals (Outer Quad) -->
    <!-- Top Petal -->
    <path d="M 0 -36 C 14 -34, 26 -22, 28 -8 C 16 -12, 6 -18, 0 -36 Z" fill="url(#roseP1)"/>
    <!-- Right Petal / Letter 'D' curve -->
    <path d="M 36 0 C 34 14, 22 26, 8 28 C 12 16, 18 6, 36 0 Z" fill="url(#roseP2)"/>
    <!-- Bottom Petal -->
    <path d="M 0 36 C -14 34, -26 22, -28 8 C -16 12, -6 18, 0 36 Z" fill="url(#roseP1)"/>
    <!-- Left Petal -->
    <path d="M -36 0 C -34 -14, -22 -26, -8 -28 C -12 -16, -18 -6, -36 0 Z" fill="url(#roseP2)"/>

    <!-- Mid Interlocking Petals (Swirling Bloom) -->
    <path d="M 0 -24 C 10 -22, 18 -14, 18 0 C 10 -4, 4 -12, 0 -24 Z" fill="url(#roseP3)"/>
    <path d="M 24 0 C 22 10, 14 18, 0 18 C 4 10, 12 4, 24 0 Z" fill="url(#roseP1)"/>
    <path d="M 0 24 C -10 22, -18 14, -18 0 C -10 4, -4 12, 0 24 Z" fill="url(#roseP3)"/>
    <path d="M -24 0 C -22 -10, -14 -18, 0 -18 C -4 -10, -12 -4, -24 0 Z" fill="url(#roseP1)"/>

    <!-- Design Core: Stylized Vector Anchor & Gold Spark -->
    <circle cx="0" cy="0" r="8" fill="url(#goldCore)"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
    
    <!-- Vector Corner Anchors (Precision Design Metaphor) -->
    <rect x="-3" y="-30" width="6" height="6" rx="1.5" fill="#FFFFFF" stroke="#E23B55" stroke-width="1"/>
    <rect x="24" y="-3" width="6" height="6" rx="1.5" fill="#FFFFFF" stroke="#E23B55" stroke-width="1"/>
    <rect x="-3" y="24" width="6" height="6" rx="1.5" fill="#FFFFFF" stroke="#E23B55" stroke-width="1"/>
    <rect x="-30" y="-3" width="6" height="6" rx="1.5" fill="#FFFFFF" stroke="#E23B55" stroke-width="1"/>
  </g>
</svg>
