<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="tfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B14"/>
      <stop offset="50%" stop-color="#12182E"/>
      <stop offset="100%" stop-color="#241126"/>
    </linearGradient>
    <linearGradient id="neonRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="100%" stop-color="#E23B55"/>
    </linearGradient>
    <radialGradient id="spotlightGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#E23B55" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#080B14" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#tfBg)"/>
  <rect width="800" height="500" fill="url(#spotlightGlow)"/>

  <!-- Spotlight Beams -->
  <polygon points="400,0 150,500 250,500" fill="rgba(226, 59, 85, 0.06)"/>
  <polygon points="400,0 550,500 650,500" fill="rgba(99, 102, 241, 0.06)"/>

  <!-- Cinema Reel Motif -->
  <circle cx="600" cy="230" r="130" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <circle cx="600" cy="230" r="90" fill="none" stroke="url(#neonRose)" stroke-width="2.5" stroke-dasharray="12 8"/>
  <circle cx="600" cy="230" r="30" fill="rgba(226, 59, 85, 0.2)"/>
  <polygon points="590,215 620,230 590,245" fill="#FFFFFF"/>

  <!-- Ticket & Tour Mockup -->
  <g transform="translate(80, 110)">
    <!-- Ticket Card Frame -->
    <rect width="380" height="260" rx="18" fill="#141724" stroke="rgba(226, 59, 85, 0.3)" stroke-width="1.5" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.7))"/>
    
    <!-- Ticket Notch -->
    <circle cx="0" cy="130" r="14" fill="#080B14"/>
    <circle cx="380" cy="130" r="14" fill="#080B14"/>
    <line x1="25" y1="130" x2="355" y2="130" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="6 6"/>

    <!-- Header Section -->
    <text x="30" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#E23B55" letter-spacing="2">THIRAI FLICKS ENTERTAINMENT</text>
    <text x="30" y="82" font-family="'Syne', sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Australasian Cinema Tour</text>
    <text x="30" y="105" font-family="-apple-system, sans-serif" font-size="11" fill="#9CA3AF">Australia · New Zealand · Fiji · Papua New Guinea</text>

    <!-- Lower Section -->
    <text x="30" y="170" font-family="-apple-system, sans-serif" font-size="10" text-transform="uppercase" fill="#6B7280" letter-spacing="1">BOX OFFICE RESULTS</text>
    <text x="30" y="200" font-family="'Syne', sans-serif" font-size="24" font-weight="800" fill="#E23B55">50,000+ <tspan font-size="14" font-weight="500" fill="#9CA3AF">Tickets Engaged</tspan></text>
    
    <g transform="translate(230, 155)">
      <rect width="120" height="34" rx="8" fill="url(#neonRose)"/>
      <text x="60" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Sold Out Shows</text>
    </g>

    <!-- Barcode -->
    <g transform="translate(30, 222)">
      <rect x="0" y="0" width="3" height="18" fill="#4B5563"/>
      <rect x="6" y="0" width="2" height="18" fill="#4B5563"/>
      <rect x="11" y="0" width="5" height="18" fill="#4B5563"/>
      <rect x="19" y="0" width="2" height="18" fill="#4B5563"/>
      <rect x="24" y="0" width="4" height="18" fill="#4B5563"/>
      <rect x="31" y="0" width="6" height="18" fill="#4B5563"/>
      <rect x="40" y="0" width="2" height="18" fill="#4B5563"/>
      <rect x="45" y="0" width="5" height="18" fill="#4B5563"/>
      <text x="70" y="14" font-family="monospace" font-size="10" fill="#6B7280">TF-ANZ-2026</text>
    </g>
  </g>
</svg>
