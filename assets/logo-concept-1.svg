<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Rich Rose Gradient -->
    <linearGradient id="roseGradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D6D"/>
      <stop offset="45%" stop-color="#E23B55"/>
      <stop offset="100%" stop-color="#9E0E2B"/>
    </linearGradient>

    <!-- Accent Petal Gradient -->
    <linearGradient id="roseGradSecondary" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA8B6"/>
      <stop offset="60%" stop-color="#E23B55"/>
      <stop offset="100%" stop-color="#C9184A"/>
    </linearGradient>

    <!-- Design Pen / Gold Gradient -->
    <linearGradient id="penNibGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Container Squircle -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="#14161F" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Subtle Inner Radial Glow -->
  <circle cx="50" cy="50" r="38" fill="url(#roseGradMain)" opacity="0.12"/>

  <!-- Logo Mark: The Blooming "D" & Designer Vector Pen Nib -->
  <g transform="translate(0, 0)">
    
    <!-- Outer Bloom Petal: Sweeps from bottom left to top right forming the iconic 'D' of Dsigns -->
    <path d="M 32 68 C 30 52, 34 34, 50 24 C 66 14, 78 28, 76 46 C 74 62, 60 74, 46 74 C 38 74, 34 72, 32 68 Z" 
          fill="url(#roseGradMain)" />

    <!-- Secondary Interlocking Petal: Inner spiral folding forward -->
    <path d="M 50 24 C 42 28, 38 38, 40 48 C 42 58, 52 64, 62 60 C 70 56, 72 44, 68 36 C 64 28, 56 22, 50 24 Z" 
          fill="url(#roseGradSecondary)" opacity="0.92" />

    <!-- Inner Rose Bud Core: Sacred geometry fold -->
    <path d="M 44 42 C 46 36, 54 34, 58 38 C 62 42, 60 50, 54 52 C 48 54, 44 48, 44 42 Z" 
          fill="#FFF0F3" />

    <!-- Designer's Vector Pen Nib / Stylus Anchor at Base: Signifying Design & Digital Craft -->
    <path d="M 28 78 L 36 62 L 44 78 Z" fill="url(#penNibGold)" />
    <!-- Pen Nib Slit & Breather Hole -->
    <line x1="36" y1="62" x2="36" y2="73" stroke="#14161F" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="36" cy="73" r="1.5" fill="#14161F"/>

    <!-- Sparkle / Creative North Star Accent (Top Right) -->
    <path d="M 72 16 Q 72 22 78 22 Q 72 22 72 28 Q 72 22 66 22 Q 72 22 72 16 Z" 
          fill="url(#penNibGold)" />
  </g>
</svg>
